[package]
name = "kite-x402-axum"
version = "0.1.0"
edition = "2024"
# Matches the `go 1.25` floor the Go template pins. 1.88 is the highest MSRV
# among the dependencies, and also what the let-chains in main.rs need.
rust-version = "1.88"
description = "Wrap any HTTP API as an x402 paid service settled on the Kite chain"
license = "Apache-2.0"
repository = "https://github.com/huaruic/kite-x402-rs"
homepage = "https://github.com/huaruic/kite-x402-rs"
readme = "README.md"
keywords = ["x402", "kite", "axum", "payments", "agents"]
categories = ["web-programming::http-server", "api-bindings"]

[dependencies]
axum = "0.8.9"
base64 = "0.23.1"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "http2", "charset"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "signal"] }
